# Control center: the panel `mochi ipc control-center toggle` opens, with
# cards on its home and pages in a navbar.
[module.control-center]
# Its width, and the most its cards or a page take above the navbar, in
# logical pixels: the control center takes the height its content needs, up
# to that, and what is taller scrolls. It never grows past the screen.
# width = 860
# height = 480
# The home's cards in this order; the ones not listed follow. The pencil in
# the control center's navbar arranges them too.
# order = []
# Cards to leave off the home.
# hidden = []
# The navbar's pages after Home in this order; the ones not listed follow.
# The pencil arranges them too.
# pages = []
# Pages to leave out of the navbar. They still open from their cards.
# hidden_pages = []
