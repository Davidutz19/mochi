# Clipboard: keeps what you copy. `mochi ipc clipboard toggle`, bound to
# SUPER+V, opens the history; picking an entry pastes it.
[module.clipboard]
# Where the history lives. Memory keeps it in memory only you can read, so
# it goes when you log out. Disk keeps it in Mochi's state folder, encrypted with a key Mochi stores in the Secret
# Service (gnome-keyring, KeePassXC); without one it stays in memory.
# storage = "memory"
# The most entries to keep; the oldest go first.
# max_entries = 500
# Remove entries last copied more than this many hours ago. 0 keeps them
# until the history is full.
# max_age_hours = 0
# Copies larger than this many megabytes aren't kept.
# max_item_mb = 16
# The most entries the picker lists.
# max_results = 50
# Don't keep copies that password managers mark as secret with the
# x-kde-passwordManagerHint type. KeePassXC marks passwords this way.
# skip_secrets = true
# Don't keep anything copied while one of these windows has the keyboard,
# matched in any case against the app id, which is the class on Hyprland.
# It needs the compositor to tell which window has the keyboard, through
# wlr-foreign-toplevel-management: Hyprland, Sway and niri do; elsewhere
# this has no effect.
# ignore = ["org.keepassxc.KeePassXC", "Bitwarden", "1Password"]
# Paste a picked entry into the window you were in, by typing Ctrl+V for
# you. false only copies it.
# paste = true
# Window classes that paste with Ctrl+Shift+V instead: terminals.
# terminals = ["kitty", "foot", "footclient", "Alacritty", "com.mitchellh.ghostty", "org.wezfurlong.wezterm", "org.kde.konsole", "org.gnome.Console", "org.gnome.Ptyxis", "xterm"]
